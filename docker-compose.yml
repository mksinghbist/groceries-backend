services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grocery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - grocery-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grocery"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/grocery?schema=public
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - grocery-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  grocery-postgres:
  grocery-uploads:
